<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorización de TikTok</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #fff; color: #111; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: auto; }
  code { display: block; padding: 12px; background: #f2f2f2; border-radius: 8px; overflow-wrap: anywhere; }
  button { margin-top: 12px; padding: 10px 16px; font: inherit; }
</style>
</head>
<body>
<main>
  <h1>Autorización de TikTok</h1>
  <p id="msg"></p>
  <code id="code" hidden></code>
  <button id="copiar" hidden>Copiar</button>
</main>
<script>
  const q = new URLSearchParams(location.search), code = q.get("code"), err = q.get("error");
  const msg = document.getElementById("msg"), box = document.getElementById("code"), btn = document.getElementById("copiar");
  if (code) {
    msg.textContent = "Copia este código. Caduca en pocos minutos y solo sirve una vez.";
    box.textContent = code;
    box.hidden = btn.hidden = false;
    btn.onclick = () => navigator.clipboard.writeText(code).then(() => (btn.textContent = "Copiado"));
  } else {
    msg.textContent = err ? "TikTok no autorizó la cuenta: " + err : "No hay ningún código en esta dirección.";
  }
</script>
</body>
</html>
